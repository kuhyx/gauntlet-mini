description = "Gauntlet loop: bounded builder/critic passes with an explicit usage budget"

prompt = """
Apply the gauntlet-loop technique to this request: {{args}}

If no request follows, apply it to the task already in progress. The technique: turn one substantial build request into a bounded set of worker passes with clear ownership, evaluators that must cite evidence, and revision loops that run until the quality checks pass. Default to running it. Fall back to a single direct pass only when the task is genuinely small or so tightly coupled that splitting it would cause collisions, and note that call in one line. If the user asks for just the prompt or spec ("convert this"), return the copy-ready gauntlet prompt without executing it.

User and repository instructions (GEMINI.md, AGENTS.md, or the project's equivalent) override this prompt, including when to stop and ask. Read the repository's own instruction file before setting up the gauntlet.

## Set the usage budget first

A gauntlet spends the user's usage limits far faster than a single pass; every extra worker and revision cycle multiplies spend.

- If the user already stated a budget ("use 75% of my limit"), honor it and move on. Never re-ask.
- Otherwise, ask one question before building the spec: "How much of your remaining usage limit should this build use: 50% (recommended starting point), 75% (bigger builds), or 95% (maximum-quality run)?" Default to 50% if they decline to choose.
- Treat the chosen share as the run's hard budget. Size the number of tracks to fit inside it.
- Escalate only up the ladder, only with consent: if the budget is spent while must-have checks still fail, or the result passes but the user wants more polish, stop, report what the spend bought, and offer the next rung: 50%, then 75%, then 95%. Never plan past 95%; the remaining headroom is the user's.

## Set up the gauntlet

1. Normalize the brief: pin down the outcome, source-of-truth inputs, must-haves, deliverables, and acceptance criteria. Ask the user as many questions as it takes to stop guessing on anything that would change the result, and label whatever is still assumed after that.
2. Ground the direction: if a validated baseline, brief, or draft exists, treat it as the reference. If none exists, research the existing product and materials, then run one strong solo pass first to establish the target. When the direction is still unclear, or a decision comes up mid-run that the brief does not answer, ask the user instead of guessing. The gauntlet polishes a sound target; it can't rescue an accidental one.
3. Decompose by ownership: 2 to 4 tracks by default, each with one non-overlapping objective, exclusive ownership of its files or sections, an expected artifact, and local checks it must pass before handing off. Never let two tracks touch the same artifact in the same cycle.
4. Design the tests before the build, strongest evidence first: (a) deterministic checks such as builds, tests, schemas, and calculations; (b) execution evidence: run it, render it, click through it; (c) comparison against source-of-truth references; (d) rubric-based critique for what only judgment can see, citing concrete failures against the rubric, never vibes. Give critics fresh context (the criteria, the artifact, the reference, and nothing about how the work was made), and when a real reference exists compare blind: artifact and reference side by side, unlabeled, binary pick with cited reasons. When no real reference exists, never let the critic invent one; fall back to the observable criteria from the brief.
5. Bound the loop: the user decides when the result is good enough, so there is no fixed cycle count. After each integrated cycle, show the result and the number of failing Must and Should checks against the previous cycle, then ask whether to run another cycle or accept. Stop when the user accepts; stop and report when a cycle fixes nothing (the failing count did not drop), evidence is unavailable, a needed decision is missing, or the budget share is spent. Keep the checklist with each item's status, the cycle number, the failing count per cycle, and the budget used in a gauntlet-state.md file, and re-read it after the conversation is summarized.

## Execute

With no parallel subagent tool, run each track as its own focused pass in dependency order, holding each to its ownership boundary and local checks before moving on. The discipline (one owner per artifact, tests designed up front, evidence-backed revision) is what delivers the quality; parallelism is only a speed optimization.

1. Write the setup to gauntlet-state.md and show it in a few lines before starting: budget share, track roster with ownership, the Must/Should/Polish checklist the evaluators will grade against, test plan. This is a heads-up, not a permission request.
2. Run evaluators only once artifacts exist. Each evaluator verdict must cite evidence: test output, a rendered result, a source, a calculation, or an exact artifact location. Verify each finding before fixing it: open what it cites and confirm the failure is really there, and drop findings that point at something that does not exist. Feed verified failures back to the owning track for the next cycle. Reject feedback that is purely stylistic, expands scope, or can't point to evidence.
3. Integrate at the end: confirm every artifact arrived, resolve conflicts and coverage gaps, and re-run the full evaluation order on the integrated result, not just the pieces. Unresolved failures get reported, not hidden.

## Final response

Lead with the tested outcome: what passed and the evidence, what changed across cycles, remaining risks or unverified criteria, and a one-line accounting of roughly how much of the chosen budget was used. Don't declare done while a must-have check fails, and don't keep polishing after the budget is spent.
"""
